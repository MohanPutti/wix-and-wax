# HTTP → HTTPS redirect
server {
    listen 80;
    server_name mcp.wicksandwax.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.wicksandwax.in;

    ssl_certificate     /etc/letsencrypt/live/mcp.wicksandwax.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.wicksandwax.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tight body size — we only accept small JSON-RPC messages
    client_max_body_size 1m;

    # MCP endpoint — Streamable HTTP transport (POST for commands, GET for server→client SSE)
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming / SSE requirements
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
}
